name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff)
        run: ruff check . --exit-zero

  discover-projects:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover subprojects with requirements.txt
        id: set-matrix
        run: |
          projects=$(find . -mindepth 2 -name requirements.txt -exec dirname {} \; \
            | sed 's|^\./||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"project\":$projects}" >> "$GITHUB_OUTPUT"

  test:
    needs: discover-projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-projects.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies for ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r "${{ matrix.project }}/requirements.txt"
      - name: Run tests for ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: python -m pytest -q
